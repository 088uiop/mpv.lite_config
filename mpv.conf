## MPV总配置：
 
 # 说明可参考：
 # https://github.com/dyphire/mpv-config/blob/master/mpv.conf
 # https://github.com/hooke007/mpv_PlayKit/blob/main/portable_config/mpv.conf

 idle=yes
 osd-bar=no
 volume-max=100
 sub-auto=fuzzy
 keepaspect-window=no
 hr-seek-framedrop=no
 directory-mode=ignore
 autocreate-playlist=same
 image-subs-hdr-peak=video
 input-builtin-bindings=no
 slang=sc,chs,zh-cn,zh-hans,tc,cht,zh-hant,zh-hk,zh-mo,zh-tw