## OSD播放列表脚本配置：

# 快捷键设置（多个按键用空格分隔）
# 向上移动光标
key_move2up=UP
# 向下移动光标
key_move2down=DOWN
# 向上翻页
key_move2pageup=PGUP
# 向下翻页
key_move2pagedown=PGDWN
# 跳到播放列表开头
key_move2begin=HOME
# 跳到播放列表末尾
key_move2end=END
# 选中（选中后可移动此文件在播放列表中的位置）
key_file_select=RIGHT
# 取消选中
key_file_unselect=LEFT
# 播放光标处文件
key_file_play=ENTER
# 移除光标处文件
key_file_remove=BS
# 关闭播放列表
key_playlist_close=ESC F9

# 播放文件时是否临时显示标题
show_title_on_file_load=no
# 播放文件时是否自动显示播放列表
show_playlist_on_file_load=no
# 播放选中文件后是否自动关闭播放列表
close_playlist_on_playfile=no
# 播放新文件时是否同步光标到当前播放项
sync_cursor_on_load=yes
# 当光标移出范围时是否循环回到开头/末尾
loop_cursor=no
# 每次打开播放列表时是否重置光标位置到当前播放项
reset_cursor_on_open=yes

# 播放列表显示超时（秒），0 表示不自动关闭
playlist_display_timeout=0
# 每页显示的播放列表条目数量
showamount=20
# 是否截断过长的文件名
slice_longfilenames=yes
# 截断时允许的最大长度（字符数）
slice_longfilenames_amount=100

###############################################################
# 字体与样式设置（ASS 样式详解）
###############################################################

# 播放列表整体样式标签（ASS override tags）
# 每个标签用反斜杠 `\` 开头，多个标签直接拼在一起，常用参数如下：
#   \rDefault    - 使用默认样式（推荐加上，避免和字幕样式冲突）
#   \an7         - 对齐方式（1~9，数字小键盘方向），7 表示左上角
#   \fs24        - 字体大小（24 像素），越大文字越大
#   \b0 / \b1    - 字体粗体开关，\b1 开启粗体
#   \blur0       - 模糊半径，0 表示不模糊
#   \bord1       - 描边粗细，1 为细描边
#   \1c&HFFFFFF& - 主文字颜色（BGR 十六进制格式），例如：
#                  白色：&HFFFFFF&   红色：&H0000FF&   绿色：&H00FF00&   蓝色：&HFF0000&
#                  注意：BGR 顺序而不是 RGB！
#   \3c&H000000& - 描边颜色（同上）
#   \q2          - 自动换行模式（推荐保留）
style_ass_tags={\rDefault\an7\fs24\b0\blur0\bord1\1c&HFFFFFF&\3c&H000000&\q2}

# 播放列表标题行样式，支持占位符：
#   %cursor - 当前光标位置（从 1 开始）
#   %plen   - 播放列表总条目数
# 样式标签与上面相同，也可以改字体大小、粗体等
playlist_header={\b1\fs30}Play List [%cursor/%plen]{\b0\fs24}

# 条目样式部分：
# %name 会被自动替换为文件标题/文件名
# 你可以通过 \1c&Hxxxxxx& 来分别给不同状态设置不同颜色
# 注释为默认样式

# 普通条目（未选中、未播放）
# 灰白色文本 • 文件名
normal_file={\1c&HCCCCCC&}• %name

# 光标所在条目（当前高亮项）
# 纯白色 > 文件名
hovered_file={\1c&HFFFFFF&}> %name

# 已选中的条目（用于多选等情况）
# 青蓝色 * 文件名
selected_file={\1c&HFFD700&}* %name

# 当前正在播放的条目
# 绿色 ▶ 文件名
playing_file={\1c&H00FF00&}▶ %name

# 当前播放中且是光标所在条目
# 绿色 ▶> 文件名
playing_hovered_file={\1c&H00FF00&}▶> %name

# 当前播放中且被选中
# 青蓝色 *▶ 文件名
playing_selected_file={\1c&HFFD700&}*▶ %name

# 分页指示符（如果播放列表太长显示不下时，顶部/底部会出现）
# 可自定义颜色或符号，比如 ▲ ▼ …
playlist_sliced_prefix={\1c&HFF0000&}▲
playlist_sliced_suffix={\1c&HFF0000&}▼