## 略缩图脚本配置：

# Socket 路径，留空即自动
socket=
# 缩略图缓存路径，留空即自动
tnpath=

# 缩略图的最大尺寸，以像素为单位
max_height=256
max_width=256

# 不知道用途就别改它
overlay_id=42

# 加载文件时就开始生成缩略图
spawn_first=yes
# 是否退出超时未活动的缩略图进程（秒）
quit_after_inactivity=0
# 是否对流媒体启用
network=no
# 是否对音频文件启用
audio=no

# 使用的解码API（缩略图使用的编码模式中，仅有限api可用且可能强制执行copy）
hwdec=yes
# 软解线程数（当无法硬解或hwdec为no时生效；对杜比视界建议6以上，超过16无意义）
sw_threads=2
# 自定义mpv路径，Mac使用bundle-app用户可选值为 bundle ，fault
binpath=default
# 是否只对时长高于该值的视频启用（秒） ，值 0 表示禁用
min_duration=0
# 预览精度。0 为自动（仅光标静止时为精确帧），1 为始终关键帧，2 为始终精确帧
precise=0
# 预览质量。预览质量模式。1 速度最快但hdr画面略欠饱和， 2 贴近gpu渲染但hdr画面略过饱和， 3 支持了单层杜比正确输出但此时速度很慢
quality=1
# 解码频率（秒）
frequency=0.125