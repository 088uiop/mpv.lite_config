## uosc脚本配置：

# 当前位置的显示样式。可选：line（线条）, bar（条形）
timeline_style=bar
# 线条时间线宽度
timeline_line_width=2
# 时间线高度
timeline_size=16
# 逗号分隔的状态列表，当处于这些状态时，元素应始终保持完全可见
# 可选状态：paused（暂停）, audio（音频）, image（图片）, video（视频）, idle（空闲）, windowed（窗口化）, fullscreen（全屏）
timeline_persistency=
# 背景颜色的顶部边框，用于在视觉上区分时间线和视频
timeline_border=1
# 在时间线上方滚动鼠标滚轮时，跳转的秒数
# 默认使用快速跳转。添加 `!` 后缀启用精确跳转。例如：`5!`
timeline_step=0
# 为流媒体内容渲染缓存指示器
timeline_cache=yes
# 为 YouTube 视频渲染热度图。可选：overlay（叠加）, above（上方）, no（不渲染）
timeline_heatmap=overlay

# 何时显示始终可见的进度条（最小化时间线）。可选：windowed（窗口化时）, fullscreen（全屏时）, always（始终）, never（从不）
# 也可以通过 `toggle-progress` 命令按需切换
progress=windowed
progress_size=2
progress_line_width=20

# 时间线上方控件的逗号分隔列表。设为 `never` 则禁用
# 参数规范：用 `{}` 括起来表示值，用 `[]` 括起来表示可选
# 完整项目语法：`[<{显示条件}>]{元素}[:{参数N}][#{徽章}[>{限制}]][?{提示文字}]`
# 通用属性：
#   `{icon}` - 用于指定图标名称的参数（例如：`face`）
# - 在此处选择：https://fonts.google.com/icons?icon.platform=web&icon.set=Material+Icons&icon.style=Rounded
# `{元素}` 及其参数：
#   `{速记名}` - 预配置的速记项：
# `play-pause`（播放/暂停）, `menu`（菜单）, `subtitles`（字幕）, `audio`（音频）, `video`（视频）, `playlist`（播放列表）,
# `chapters`（章节）, `editions`（版本）, `stream-quality`（流质量）, `open-file`（打开文件）, `items`（项目）,
# `next`（下一个）, `prev`（上一个）, `first`（第一个）, `last`（最后一个）, `audio-device`（音频设备）, `fullscreen`（全屏）,
# `loop-playlist`（循环播放列表）, `loop-file`（循环文件）, `shuffle`（随机播放）, `autoload`（自动加载）
#   `speed[:{比例}]` - 显示速度滑块，[{比例}] - controls_size 的倍数，默认：1.3
#   `command:{图标}:{命令}` - 按下时执行 {命令} 的按钮
#   `toggle:{图标}:{属性}[@{所有者}]` - 切换 mpv 属性的按钮。是下面 yes/no 循环的速记
#   `cycle:{默认图标}:{属性}[@{所有者}]:{值1}[={图标1}][!]/{值N}[={图标N}][!]`
#    - 循环切换 mpv 属性值的按钮，每个值可选择不同的图标和活动标志
#    - 末尾存在 `!` 会将按钮样式设置为活动状态
#    - `{所有者}` 是管理此属性的脚本名称（如果有）。设为 `uosc` 则可使用 uosc 选项
#   `gap[:{比例}]` - 显示一个空白的间隔
#    {比例} - controls_size 的倍数，默认：0.3
#   `space` - 填充前一个和后一个项目之间的所有可用空间，用于将项目对齐到右侧
#    - 多个 space 会平分可用空间，可用于居中
#   `button:{名称}` - 状态、外观和点击动作由外部脚本管理的按钮
# 项目可见性控制：
#   `<[!]{条件1}[+[!]{条件N}][,{更多条件组}]>` - 可选前缀，用于控制元素的可见性
#   - `+` 创建 AND 条件，`,` 分割为 OR 组。例如：`<foo,bar+baz>` -> `foo OR (bar AND baz)`
#   - `{条件}` 可以是以下之一：
#  - `idle` - 如果 mpv 处于空闲模式（未加载文件）则为真
#  - `image` - 如果当前文件是单张图片则为真
#  - `audio` - 如果当前是纯音频文件则为真
#  - `video` - 如果文件包含视频轨道则为真
#  - `has_many_video` - 如果文件包含多个视频轨道则为真
#  - `has_image` - 如果文件包含封面或其他图片轨道则为真
#  - `has_audio` - 如果文件包含音频轨道则为真
#  - `has_many_audio` - 如果文件包含多个音频轨道则为真
#  - `has_sub` - 如果文件包含字幕轨道则为真
#  - `has_many_sub` - 如果文件包含多个字幕轨道则为真
#  - `has_many_edition` - 如果文件包含多个版本则为真
#  - `has_chapter` - 如果文件包含章节列表则为真
#  - `stream` - 如果当前文件是从流读取则为真
#  - `has_playlist` - 如果当前播放列表有 2 个或更多项目则为真
#  - `{mpv_prop}` - 任何 mpv 属性（注意：在脚本中设置 `user-data/foo` 以添加自定义属性）
#   - 前缀加上 `!` 以否定所需条件
#   示例：
#  - `<stream>stream-quality` - 仅对流显示流质量按钮
#  - `<has_audio+!audio>audio` - 对所有包含音频轨道但不是纯音频的文件显示音频轨道按钮
# 在元素参数后放置 `#{徽章}[>{限制}]` 以赋予其徽章。可用徽章：
#   `sub`（字幕）, `audio`（音频）, `video`（视频） - 轨道类型计数
#   `{mpv_prop}` - 任何对你有意义的 mpv 属性：https://mpv.io/manual/master/#property-list
# - 如果属性值是数组，则显示其大小
#   `>{限制}` 仅在徽章的数值超过此阈值时显示
#   示例：`#audio>1`
# 在元素配置后放置 `?{提示文字}` 以赋予其提示文字
# 示例实现：
#   menu = command:menu:script-binding uosc/menu-blurred?菜单
#   subtitles = command:subtitles:script-binding uosc/subtitles#sub?字幕
#   fullscreen = cycle:crop_free:fullscreen:no/yes=fullscreen_exit!?全屏
#   loop-playlist = cycle:repeat:loop-playlist:no/inf!?循环播放列表
#   toggle:{图标}:{属性} = cycle:{图标}:{属性}:no/yes!
controls=play-pause,menu,gap,subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,command:grid_view:script-message open_add_total_menu?弹幕设置,cycle:toggle_on:show_danmaku@uosc_danmaku:on=toggle_on/off=toggle_off?弹幕开关,gap,space,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
controls_size=24
controls_margin=8
controls_spacing=2
controls_persistency=

# 音量控制显示位置：none（无）, left（左侧）, right（右侧）
volume=none
volume_size=24
volume_border=1
volume_step=1
volume_persistency=

# 播放速度控件：鼠标拖拽或滚轮改变，点击重置
speed_step=0.1
speed_step_is_factor=no
speed_persistency=

# 控制所有菜单，例如上下文菜单、字幕加载器/选择器等
menu_item_height=32
menu_min_width=240
menu_padding=4
# 确定是否需要按 `/` 或 `ctrl+f` 来激活搜索，还是输入任何文本就足够了
# 启用后，如果打开菜单的键是 unicode 字符，则无法再用同一个键来切换菜单关闭
menu_type_to_search=yes

# 顶部栏，包含窗口控件和媒体标题
# 可选：never（从不）, no-border（无边框时）, always（始终）
top_bar=no-border
top_bar_size=40
# 可选：`no`（隐藏）, left（左） 或 right（右）
top_bar_controls=no
# 可选：`no`（隐藏）, `yes`（继承 mpv.conf 中的标题）, 或自定义模板字符串
top_bar_title=${media-title}
# 启用替代顶部栏标题的模板字符串。如果替代标题与主标题匹配，则会被隐藏。提示：主标题用 `${media-title}`，替代标题用 `${filename}`
top_bar_alt_title=${filename}
# 可选：
#   `below`  => 在主标题下方显示替代标题
#   `toggle` => 通过点击顶部栏或调用 `toggle-title` 绑定，在主标题和替代标题之间切换顶部栏文本
top_bar_alt_title_place=below
# 加载以下文件类型时闪烁顶部栏。可选：audio（音频）,video（视频）,image（图片）,chapter（章节）
top_bar_flash_on=video,audio
top_bar_persistency=

# 无边框模式下绘制的窗口边框大小
window_border_size=1

# 如果没有播放列表且文件播放结束，则加载目录中的下一个文件
# 使用下面的 `load_types` 配置来确定接下来要加载的文件类型
# 启用后，uosc 会将 mpv 配置 `keep-open` 设为 `yes`，`keep-open-pause` 设为 `no`
autoload=no
# 启用 uosc 的播放列表/目录随机播放模式
# 这只是让下一个选中的播放列表或目录项是随机的，就像世界上任何其他播放器一样。它还有一个易于切换的控制按钮
shuffle=no

# 按此系数缩放界面
scale=1
# 全屏时的缩放
scale_fullscreen=1.2
# 调整文本缩放以适应你的字体
font_scale=1
# 直接在视频上方绘制文本和图标时的边框
text_border=1.2
# 按钮、菜单及所有其他矩形的边框半径
border_radius=4
# 以 RGB HEX 格式列出的颜色覆盖列表。默认值：
# foreground=ffffff（前景色）, foreground_text=000000（前景文本色）, background=000000（背景色）, background_text=ffffff（背景文本色）, curtain=111111（幕布色）, success=a5e075（成功色）, error=ff616e（错误色）, match=69c5ff（匹配色）, heatmap=00adee（热度图色）
color=
# 各种 UI 元素背景和形状的不透明度覆盖列表
# 这不影响任何文本，文本总是完全渲染。默认值：
# timeline=0.9（时间线）, position=1（位置）, chapters=0.8（章节）, slider=0.9（滑块）, slider_gauge=1（滑块刻度）, controls=0（控件）, speed=0.6（速度）, menu=1（菜单）, submenu=0.4（子菜单）, border=1（边框）, title=1（标题）, tooltip=1（提示）, thumbnail=1（缩略图）, curtain=0.8（幕布）, idle_indicator=0.8（空闲指示器）, audio_indicator=0.5（音频指示器）, buffering_indicator=0.3（缓冲指示器）, playlist_position=0.8（播放列表位置）, heatmap=0.4（热度图）
opacity=
# 需要以性能为代价来优化的功能列表
# text_width - 使用更精确的文本宽度测量，单独测量每个文本字符串的宽度，而不是仅测量一次已知字母的宽度然后相加
# sorting - 使用能更好地处理非英语语言（尤其是亚洲语言）的文件名排序
#   目前，这仅在 Windows 上可用，在其他平台上无效
refine=text_width,sorting
# 动画持续时间（毫秒）
animation_duration=100
# `flash-{元素}` 命令使用的闪烁持续时间（毫秒）
flash_duration=1000
# 元素完全淡入/淡出的像素距离阈值
proximity_in=40
proximity_out=120
# 在整个 UI 中仅使用粗体字重
font_bold=no
# 可选 `total`（总时长）, `playtime-remaining`（按当前速度缩放的剩余播放时间）, `time-remaining`（文件的剩余长度）
destination_time=total
# 时间戳中显示秒的小数部分精度
time_precision=0
# 如果流的缓冲时间低于此秒数，则在时间线中显示，设为0则禁用
buffered_time_threshold=0
# 当 mpv 自动隐藏光标时隐藏 UI。计时由 `mpv.conf` 中的 `cursor-autohide` 控制（以毫秒为单位）
autohide=no
# 可选：flash（闪烁）, static（静态）, manual（手动，由 flash-pause-indicator 和 decide-pause-indicator 命令控制）
pause_indicator=
# 流质量菜单中列出的分辨率选项
stream_quality_options=4320,2160,1440,1080,720,480,360,240,144
# 媒体文件类型识别
video_types=3g2,3gp,asf,avi,f4v,flv,h264,h265,m2ts,m4v,mkv,mov,mp4,mp4v,mpeg,mpg,ogm,ogv,rm,rmvb,ts,vob,webm,wmv,y4m
audio_types=aac,ac3,aiff,ape,au,cue,dsf,dts,flac,m4a,mid,midi,mka,mp3,mp4a,oga,ogg,opus,spx,tak,tta,wav,weba,wma,wv
image_types=apng,avif,bmp,gif,j2k,jp2,jfif,jpeg,jpg,jxl,mj2,png,svg,tga,tif,tiff,webp
subtitle_types=aqt,ass,gsub,idx,jss,lrc,mks,pgs,pjs,psb,rt,sbv,slt,smi,sub,sup,srt,ssa,ssf,ttxt,txt,usf,vt,vtt
playlist_types=m3u,m3u8,pls,url,cue
# 文件导航和 `autoload` 使用的类型池，用于确定接下来要加载的文件类型
# 可用：video（视频）, audio（音频）, image（图片）, playlist（播放列表）, same（相同类型）。`same` 表示与当前打开文件相同的类型池（不仅仅是扩展名）
load_types=video,audio,image
# 默认打开文件菜单的目录。在 Windows 上使用 `{drives}` 打开驱动器菜单
default_directory={drives}
# 读取目录时列出隐藏文件。由于环境限制，目前仅隐藏以点开头的文件
show_hidden_files=yes
# 删除文件时移动到垃圾箱（回收站）。
use_trash=yes
# 根据 UI 元素的可见性调整 OSD 边距
adjust_osd_margins=yes

# 为一些常见的章节类型添加章节范围指示器
# 除了在时间线顶部以菱形图标显示章节开始外，该章节范围的时间线部分也会根据下面的配置进行着色
#
# 语法是以逗号分隔的 `{类型}:{颜色}` 对列表，其中：
# `{类型}` => 范围类型。当前支持的有：
#   - `openings`（片头）, `endings`（片尾） => 动漫片头/片尾
#   - `intros`（开场）, `outros`（结尾） => 视频开场/结尾
#   - `ads`（广告） => 由类似 https://github.com/po5/mpv_sponsorblock 的赞助块软件创建的片段
# `{颜色}` => RGB(A) HEX 颜色代码（`rrggbb` 或 `rrggbbaa`）
#
# 要排除标记任何范围类型，只需将其从列表中移除
chapter_ranges=openings:30abf964,endings:30abf964,ads:c54e4e80
# 添加替代的 lua 模式来识别简单章节范围的开头（除了 `ads`）
# 语法：`{类型}:{模式}[,{模式N}][;{类型}:{模式}[,{模式N}]]`
chapter_range_patterns=openings:オープニング;endings:エンディング

# 本地化语言优先级，从高到低
# 也控制 `download-subtitles` 菜单获取的语言
# 内置语言可以在 `uosc/intl` 中找到
# `slang` 是一个关键字，用于继承 `--slang` mpv 配置的值
# 支持自定义 json 文件的路径：`languages=~~/custom.json,slang,en`
languages=slang,en
# 默认情况下，字幕下载到当前打开文件的目录中
# 如果文件是从 URL 播放的，则改用此目录（扩展为 `{mpv_config_dir}/subtitles`）
# 在路径前加 `!` 以强制所有字幕保存到该处。示例：`!~~/subtitles`
subtitles_directory=~~/subtitles

# 要禁用的元素 ID 的逗号分隔列表。可用 ID：
#   window_border（窗口边框）, top_bar（顶部栏）, timeline（时间线）, controls（控件）, volume（音量）
#   idle_indicator（空闲指示器）, audio_indicator（音频指示器）, buffering_indicator（缓冲指示器）, pause_indicator（暂停指示器）
disable_elements=